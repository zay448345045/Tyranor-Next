name: Android Beta Release

on:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"

permissions:
  contents: write

concurrency:
  group: android-beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-change:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect app version change
        id: version
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -z "${before}" || "${before}" == "0000000000000000000000000000000000000000" ]]; then
            before="${after}^"
          fi

          old_version="$(git show "${before}:app/build.gradle.kts" 2>/dev/null | grep -E 'version(Name|Code)[[:space:]]*=' || true)"
          new_version="$(grep -E 'version(Name|Code)[[:space:]]*=' app/build.gradle.kts || true)"

          if [[ "${old_version}" == "${new_version}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          version_name="$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          version_code="$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')"

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "version_name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"

  release-beta:
    name: Release Beta APK
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIKARINAGI_CLIENT_ID: ${{ vars.HIKARINAGI_CLIENT_ID }}

    steps:
      - name: Validate release configuration
        run: |
          if [[ -z "${HIKARINAGI_CLIENT_ID}" ]]; then
            echo "::error::Missing GitHub repository variable: HIKARINAGI_CLIENT_ID"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

          keystore="${RUNNER_TEMP}/tyranor-next-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          {
            echo "ANDROID_KEYSTORE_FILE=${keystore}"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release metadata
        id: meta
        run: |
          version="${{ needs.detect-version-change.outputs.version_name }}"
          version_code="${{ needs.detect-version-change.outputs.version_code }}"
          tag="beta-${version}"

          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [[ -z "${apk}" ]]; then
            echo "No release APK found." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "apk=${apk}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_PATH: ${{ steps.meta.outputs.apk }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${APK_PATH}" --clobber
          else
            gh release create "${TAG_NAME}" "${APK_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "Tyranor Next ${VERSION_NAME}" \
              --notes "Automated beta build from versionCode ${VERSION_CODE}, commit ${GITHUB_SHA}." \
              --prerelease
          fi
